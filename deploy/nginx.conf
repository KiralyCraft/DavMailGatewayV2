# Example server block, not a complete global nginx.conf.
# Replace hostname and certificate paths, then set gateway.toml:
# [web]
# host = "127.0.0.1"
# port = 8080
# base_url = "https://gateway-admin.example.org"
# A confidential Web OAuth app also needs a client secret in the configured
# environment variable, and the exact registered /oauth/callback redirect.
server {
    listen 443 ssl;
    server_name gateway-admin.example.org;
    ssl_certificate /etc/letsencrypt/live/gateway-admin.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gateway-admin.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # OAuth callback query strings contain short-lived codes. Do not log them.
    # Also inspect any fronting load balancer/WAF logging policy.
    access_log off;
    error_log /dev/null;
    client_max_body_size 32k;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 75s;
    }
}
