[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "noreply-mcs-gateway"
version = "0.1.0"
description = "A small, durable, passwordless-LAN SMTP to Microsoft 365 sending gateway"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
dependencies = [
    "aiohttp>=3.13.3,<4",
    "cryptography>=46,<51",
    "PyJWT>=2.10.1,<3",
    "defusedxml>=0.7.1,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[project.scripts]
noreply-gateway = "noreply_gateway.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
noreply_gateway = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
